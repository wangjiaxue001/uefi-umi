# cmi 的构建配置。字段含义见 build_uefi.py / UniXNU 的 [firmware] 段。
#
# uefi_fd 的 base/size 来自本机 xbl_5 里的 uefiplat.cfg（offset 0xc893c），
# 不是从 umi 复制的：
#   0x9FC00000, 0x00300000, "UEFI FD",    AddMem, SYS_MEM, ...
#   0x9FF90000, 0x00040000, "UEFI Stack", AddMem, SYS_MEM, ...
#   同一文件里 UnusableDDRMemoryStartAddr = 0x80000000 / Size = 0x600000，
#   与设备 DT 的 hyp_region 一致。

[status]
model_count = 1

[boot_shim]
requires_kernel_header = true

[uefi_fd]
base = 0x9FC00000
size = 0x00300000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = true

[boot_image]
header_version = 1
